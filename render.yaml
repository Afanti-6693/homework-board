# Render.com 一键部署配置（免费版）
# 部署方式：在 Render 新建 Web Service → 连接你的 GitHub 仓库 → 选本文件即可
# 平台会自动注入 PORT 环境变量，无需手动设置
services:
  - type: web
    name: kids-homework
    runtime: node
    plan: free
    buildCommand: "npm install"
    startCommand: "node server.js"
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        sync: false
